<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .event-label {
    padding: 48px 28px 18px;
    display: flex;
    align-items: baseline;
    gap: 14px;
    border-top: 1px solid rgba(26,26,24,0.08);
  }
  .event-label:first-of-type { border-top: none; }
  .event-label h2 {
    font-family: 'EB Garamond', serif;
    font-size: 24px;
    font-weight: 400;
    font-style: italic;
    letter-spacing: -0.01em;
    color: #1a1a18;
  }
  .event-label span {
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: #8a8880;
  }
</style>
</head>
<body>

<nav id="nav">
  <a class="nav-name" href="index.html">Diana Wang</a>
  <ul class="nav-links">
    <li><a href="daily-life.html">Daily Life</a></li>
    <li><a href="events.html" class="active">Events</a></li>
    <li><a href="creative.html">Creative</a></li>
  </ul>
  <div class="nav-social">
    <a href="#">Instagram</a>
    <a href="#">About</a>
  </div>
</nav>

<main>
  <div class="page-hero">
    <h1>Events</h1>
    <p>Concerts &amp; performances</p>
  </div>
  <div id="events-container"></div>
</main>

<footer>
  <span>Diana Wang</span>
  <span id="footer-year"></span>
</footer>

<div id="lightbox">
  <button id="lightbox-close" aria-label="Close">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script src="watermark.js"></script>
<script>
  window.addEventListener('scroll', () => {
    document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 10);
  }, { passive: true });

  const lb    = document.getElementById('lightbox');
  const lbImg = document.getElementById('lightbox-img');
  document.getElementById('lightbox-close').addEventListener('click', () => lb.classList.remove('open'));
  lb.addEventListener('click', e => { if (e.target === lb) lb.classList.remove('open'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('open'); });

  const fadeObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.style.opacity = 1;
        e.target.style.transform = 'none';
        fadeObs.unobserve(e.target);
      }
    });
  }, { threshold: 0.08 });

  async function loadEvents() {
    const container = document.getElementById('events-container');
    try {
      const res    = await fetch('data/events.json');
      const events = await res.json();

      for (const ev of events) {
        // event heading
        const label = document.createElement('div');
        label.className = 'event-label';
        label.innerHTML = `<h2>${ev.event}</h2>${ev.date ? `<span>${ev.date}</span>` : ''}`;
        container.appendChild(label);

        // masonry grid for this event
        const grid = document.createElement('div');
        grid.className = 'grid';
        grid.style.marginTop = 'var(--gap)';
        container.appendChild(grid);

        for (const photo of ev.photos) {
          const item = document.createElement('div');
          item.className = 'grid-item';
          item.style.cssText = 'opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s';

          const img   = document.createElement('img');
          img.alt     = photo.caption || '';
          img.loading = 'lazy';

          img.src = photo.src;
          img.addEventListener('click', () => {
            lbImg.src = photo.src; lbImg.alt = img.alt;
            lb.classList.add('open');
          });

          item.appendChild(img);
          if (photo.caption) {
            const cap       = document.createElement('div');
            cap.className   = 'caption';
            cap.textContent = photo.caption;
            item.appendChild(cap);
          }
          grid.appendChild(item);
          fadeObs.observe(item);
        }
      }
    } catch(e) {
      console.warn('Could not load events.json', e);
    }
  }

  loadEvents();
  document.getElementById('footer-year').textContent = new Date().getFullYear();
</script>
</body>
</html>
